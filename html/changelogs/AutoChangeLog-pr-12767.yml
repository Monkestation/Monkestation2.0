author: "Ghommie, MrMelbert, vinylspiders, ArcaneMusic, san7890, Ben10Omintrix, tralezab, JohnFulpWillard, jwc1015, Zenitheevee, Paxilmaniac, homexp13, Y0SH1M4S73R"
delete-after: True
changes:
  - rscadd: "Fish analyzers can be used for fish scanning experiments and can be bought as a goodie."
  - rscadd: "Aquariums have a small feed storage that feeds the fish automatically, also works with plumbing."
  - rscadd: "Fish catalogs can be bought as a goodie."
  - rscadd: "You can fish in hydroponics trays with water and nothing planted in them."
  - rscadd: "Added a few fish related bounties."
  - rscadd: "Fish cases can be printed from the service techfab and the autolathe."
  - rscadd: "Most fishing rods come with a hook and line preinstalled. Hooks are needed to fish."
  - rscadd: "The rescue and jawed hook can snag and reel in mobs. The jawed hook also slows them down."
  - rscadd: "Added the auto-reel fishing line, it speeds up fishing and lets you yank things towards you."
  - rscadd: "Fishes love kronkaine."
  - rscadd: "Examining a fishing spot twice with enough fishing skill (or the skillchip) lists the fish you can catch there."
  - rscadd: "New fish: the lavaloop (lava and plasma rivers), the anxious zipzap and the monocloning jumpercable."
  - rscadd: "New aquarium, the bioelectricity generator."
  - rscadd: "Electric eels prefer used car batteries for bait."
  - rscadd: "Aquariums influence the beauty of the room based on their contents. Morbid people like dead fish in them."
  - rscadd: "You can now fish with explosives."
  - rscadd: "Fish can be sold through cargo, bigger fish sell for more."
  - rscdel: "Removed the specific fish bounty, the other two pay a bit more."
  - balance: "Without a reel line the rod range is shorter. The master fishing rod comes with a better line and hook."
  - balance: "Reacting fast when a fish bites gives you a head start in the minigame. Clicking early only delays the bite a bit instead of resetting it."
  - balance: "Bait quality affects the chance of rarer fish. Any bait removes fishing duds."
  - balance: "Tetrodotoxin can be synthesized and pufferfish give more of it."
  - balance: "The fishing skill is a bit stronger and the bait is easier to control."
  - balance: "Aquariums start unanchored with breeding enabled."
  - qol: "Fish analyzers have a UI."
  - qol: "You can unhook the hooked item of a fishing rod with right click."
  - sound: "Reeling in something plays a sound."
  - image: "Resprited fish and the aquarium."
  - bugfix: "Bait is actually used up when you catch a fish."
  - bugfix: "Fishing up spawners gives you the item instead of a broken spawner."
  - bugfix: "Fishing rods work on adjacent targets."
  - bugfix: "Grinding fish no longer gives a silly amount of blood and gibs."
  - bugfix: "Fixed fish prices using xor instead of a power."
  - bugfix: "Mixotrophic fish properly lack food requirements."