author: "Absolucy"
delete-after: True
changes:
  - bugfix: "(PapaMichael) chat should actually scroll all the way to the bottom now, instead of making you scroll manually"
  - bugfix: "(PapaMichael) imported chat settings now actually save, instead of vanishing next round"
  - bugfix: "(sqn) toggling a chat tab's message filters applies right away now"
  - bugfix: "chat tooltips starting with a number no longer get cut down to just the number"
  - bugfix: "the music player no longer shows a garbage upload date when there isn't one"
  - bugfix: "joining a DJ station or walkman song partway through now actually starts it at the right spot, instead of from the beginning"
  - bugfix: "new players with no saved chat settings can hear admin music again"
  - bugfix: "the \"scroll to bottom\" button in chat shows up again when you're scrolled up"
  - bugfix: "the chat scroll tracking tolerance setting actually does something now"
  - bugfix: "chat no longer randomly stops autoscrolling when a big message (like an examine) or a burst of messages comes in"
  - bugfix: "Hopefully fixed most chat scrolling issues in general, tbh."
  - bugfix: "chat no longer stays blank for new players, or when chat settings are slow to load"
  - bugfix: "the \"colored names\" chat setting works again"
  - bugfix: "chat no longer breaks on every join if your saved chat data got corrupted"
  - qol: "chat now tells you whenever something goes wrong with loading or saving your chat data"
  - bugfix: "chat highlights now work for terms with punctuation or accents"
  - bugfix: "\"Exact\" chat highlights now work with accented letters and terms ending in punctuation"
  - bugfix: "the chat highlight list no longer reorders itself after you delete the default highlight"
  - rscadd: "You can now see which storage backend your chat settings use."