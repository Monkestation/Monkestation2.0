author: "Absolucy"
delete-after: True
changes:
  - rscadd: "Storytellers now support latejoin antags!"
  - bugfix: "Fixed the roundstart roleset pick ignoring the storyteller's tag multipliers."
  - bugfix: "Fixed scheduled events eating points if they failed their last-second recheck."
  - bugfix: "Fixed scheduled events possibly firing twice, or track possibly buying two events, if a ban check slept at the wrong time."
  - bugfix: "Antag events that get nobody now refund their points and don't use up an occurrence"
  - bugfix: "Xenos/paradox clones with nowhere to spawn get refunded instead of hanging around forever"
  - balance: "Antag events that only get some of their antags refund the rest"