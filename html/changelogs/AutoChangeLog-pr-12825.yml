author: "JohnFulpWillard, Fikou, timothymtorres, D4C-420, Cheshify, Jacquerel, necromanceranne, MrMelbert, mc-oofert, TealSeer, 13spacemen, Hatterhat, SmArtKar, Thunder12345, Hugbug"
delete-after: True
changes:
  - rscadd: "Added the athletics skill. Work out at the gym and sleep afterwards to level it up, a good diet helps."
  - rscadd: "Athletics makes you faster at carrying people and climbing, and lets you see how fit other people are."
  - rscadd: "Reworked the punching bag and weight machines, buckle into a weight machine and use the action to work out."
  - rscadd: "Added the Herculean gravitronic spinal implant, which can be upgraded into the Atlas implant with a gravity anomaly core."
  - rscadd: "Added golden gloves for legendary athletes and evil boxing gloves."
  - balance: "Boxing now uses your athletics level, alternating buttons and hands gives different combos and boxers can block while in throw mode."
  - rscadd: "Punching mitts! Punch wildlife to death with hunter boxing. Get them from the mining vendor or voucher, concussive gauntlets teach it too."
  - balance: "Megafauna can be affected by martial arts."
  - refactor: "Martial arts were refactored to use signals, they should act a lot more consistent. Report anything funky."
  - rscadd: "If you know more than one martial art you can swap between them with the Swap Style verb."
  - balance: "Punches deal damage in a range again and no longer knock down or deal stamina damage by themselves. Staggering someone and punching them is the new combo."
  - balance: "Punching a grappled target hits as hard as a kick, strong arm users slam floored targets into the tiles."
  - rscadd: "Drunken fist fighting has bonuses and penalties depending on how drunk you are, bartenders are drunken brawlers."
  - balance: "Athletics and the strength mutation improve your punches."
  - balance: "CQC leg sweeps knock down instead of paralyzing, head kicks only knock out targets on the floor in stamina crit, and CQC stamina damage was doubled back up."
  - bugfix: "CQC can no longer steal backtank misters and other tethered items."
  - bugfix: "Boxing hooks and uppercuts actually happen now."
  - bugfix: "Multi hit weapons cost stamina again and sleeping carp knocks out at the right stamina."
  - balance: "Surviving a heart attack depends on your fitness."
  - rscadd: "Chairs can block tackles."
  - balance: "Being staggered while tired makes you resist out of passive grabs."
  - refactor: "The shove slowdown is now a status effect called Staggered, you sway a bit while staggered."
  - balance: "The Strength mutation and the RD skillchip give the strength trait, Stimmed gives stimmed."
  - image: "Added sprites for the golden gloves, punching mitts and the exercised alert, updated the gym equipment sprites."