author: "AitorLogedo"
delete-after: True
changes:
  - bugfix: "Regenerative Coma and Plasma Fixation no longer keep their effects after you're cured."
  - bugfix: "Sheep can be sheared with a razor again."
  - bugfix: "Robotic chickens EMP what they hit again."
  - bugfix: "Broken leg bones hurt when you walk on them again."
  - bugfix: "Taking off gauze or a splint updates the wound properly."
  - bugfix: "Material bane triggers when the bane gets embedded in you."
  - bugfix: "The MOD mirage grenade dispenser dispenses grenades again."
  - bugfix: "Deconstructing a griddle with a crowbar no longer deletes the crowbar."
  - bugfix: "Fixed admin verb permission checks when used from panels."
  - bugfix: "Hand items like finger guns can't be put in the MOD holster anymore."
  - bugfix: "Emagged wall safes no longer turn invisible."
  - bugfix: "Jumpsuits without a casual sprite can't be adjusted into invisibility anymore."
  - bugfix: "Mk-honk shoes can be refilled with bananium again."
  - bugfix: "Water spray only bothers cat people."
  - bugfix: "The HoP and captain naval caps have armor like their normal caps."
  - bugfix: "The AI needs the examination upgrade to examine humans, no matter how it examines."
  - bugfix: "You can't pixel shift while stunned or immobilized."
  - bugfix: "Offstation comms consoles can't request the spare ID safe codes."
  - bugfix: "Droppers can be used on open growth dishes."
  - bugfix: "Repacking the same machine twice at once no longer dupes it."
  - bugfix: "Deployable solar panels and trackers no longer leave their assembly behind when repacked."
  - bugfix: "Building a solar tracker uses up the assembly instead of duplicating it."
  - bugfix: "Spam clicking a flatpack no longer deploys more than one machine."