author: "ArcaneMusic, CabinetOnFire, Kapu, grungussuss, Melbert, vinylspiders, EnnyDaiz"
delete-after: True
changes:
  - rscadd: "Cargo can now buy a Nanomusic boombox! Comes with a demo tape, more tapes can be found as goodies, on the black market, in the game vendor and in the Pizza Party domain."
  - rscadd: "The boombox can also play approved cassettes."
  - sound: "Looping sounds like the supermatter, grav gen and kitchen machines now update as you move, and you can hear long sounds even if you arrive halfway through."
  - sound: "Sound falloff is softer."
  - sound: "The supermatter has start and stop sounds."
  - sound: "Ambience waits for the last sound to finish before playing a new one."
  - sound: "Sounds are stereo again and no longer get a forced echo, so positional audio sounds a lot more 3D."
  - sound: "Most of the station no longer has hangar sized reverb."
  - bugfix: "Looping sounds and boombox tapes follow whoever is carrying them, and cassettes no longer restart when you change z-levels."
  - bugfix: "Cassettes playing on a shuttle no longer cut out for the passengers when it takes off."
  - bugfix: "Looping sounds no longer steal the voice, ringtone, siren, admin sound and shuttle channels."
  - bugfix: "Ear damage makes things quieter instead of making you deaf past one tile."
  - bugfix: "Elevator music and other direct loops respect their volume and your volume sliders."
  - bugfix: "Changing a volume slider updates sounds that follow you right away."
  - bugfix: "The alt siren starts on its start sound."
  - bugfix: "Randomly pitched sounds no longer lean low on 48 kHz files."