author: "Absolucy"
delete-after: True
changes:
  - rscadd: "station traits roll off a budget now, so small traits can sneak in next to the big ones"
  - rscadd: "some station traits give you a sign-up button in the lobby"
  - rscadd: "cargo gorilla is a lobby sign-up now instead of a ghost poll"
  - rscadd: "pun pun is a playable crewmember on monkey day"
  - rscadd: "new negative trait: radioactive nebula. build the shielders or enjoy a permanent rad storm"
  - rscadd: "new traits: dust stormfront, postal workers strike, geared assistants, the great skub contention, glowsticks party, machine language malfunction, spiked drinks"
  - bugfix: "blackouts, night shift, grid checks, electrical storms and the malf AI blackout actually hit mapped APCs now"
  - bugfix: "stuff that's supposed to change event odds (stormfront traits, shuttle insurance, meteor shields) actually does now"
  - bugfix: "the department resupply shuttle loan can actually show up"
  - bugfix: "bureaucratic error can't give HoS or blueshield infinite slots anymore"
  - bugfix: "yellow clown spawns with the clown instead of at arrivals"