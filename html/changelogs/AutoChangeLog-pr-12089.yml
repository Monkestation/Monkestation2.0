author: "EatsTheGrapes"
delete-after: True
changes:
  - rscadd: "Robotics can build IPC shells after unlocking the required research by assembling an IPC core, synthetic organs, a wired and secured head, limbs, and a wired and secured screen, then finalizing the chassis with a multitool."
  - rscadd: "Built IPC shells start without a brain or charging cord. MMIs and positronic brains, including brains recovered from roundstart IPCs, can be installed through cybernetic brain surgery. Charging cords can be installed separately through augmentation surgery."
  - rscadd: "Positronic brains can be imprinted to a master before their first activation. Imprinted positronics and Syndicate MMIs can create IRCs bound to their master or directive."
  - rscadd: "Robotics can build spiderbots by attaching a manipulator to a robotic head. Spiderbots hold an MMI or positronic brain, can ventcrawl, and have no hands. IDs with robotics access can eject their brain."
  - rscadd: "Emagging a spiderbot binds it to the emagger, strengthens it, and blocks ID-based brain removal. Emagged spiderbots explode and gib on death, destroying their installed brain."
  - qol: "IPC screens are now printable organs that can be removed and replaced."
  - code_imp: "IPC food processing is now handled by the synthetic stomach rather than the species."
  - qol: "Surgically removing an IPC's brain returns its MMI or positronic brain with the original name and personality, allowing it to be installed into another shell."
  - balance: "Traumatic IPC brain removal causes a 30-second reboot in the recovered MMI or positronic brain. When the reboot finishes, the occupant's ghost is brought back using the same return mechanism as defibrillation."
  - qol: "Robotic limbs can be replaced with other robotic limb types through mechanical augmentation surgery."
  - qol: "The MOD paint kit is now the robotics paint kit. It can restyle robotic limbs and IPC chassis, still paints MODsuits, and no longer requires plastic to print."
  - bugfix: "Restyling robotic limbs with the robotics paint kit preserves their existing limb type and upgrades."