author: "Mothblocks, hry-gh, JohnFulpWillard, FalloutFalcon"
delete-after: True
changes:
  - bugfix: "Typepath suggestions in the command bar are now filtered on the frontend."
  - bugfix: "In the command bar, exact matches now enter the verb."
  - bugfix: "Quotes aren't required around arguments in the command bar anymore, letting you use quotes yourself in messages."
  - bugfix: "Removes a ton of pick up verbs from the command bar."
  - qol: "Added a setting to disable showing command bar suggestions as you type (unless you press space)."
  - qol: "The command bar now starts on Say instead of Command mode."
  - qol: "Pressing backspace while unfocused now clears your command bar."
  - qol: "The command bar's last used mode is now kept between rounds."
  - admin: "Asay is now properly sanitized."
  - bugfix: "When typing in the command bar, thinking/typing indicators will be reflected in game again."
  - bugfix: "The command bar no longer goes into Say on login when you had Command saved."