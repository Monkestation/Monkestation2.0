author: "Cruix, grungussuss, SmArtKar, Charlotte-Sugar, ArcaneMusic, Jacquerel, SyncIt21, Kryson"
delete-after: True
changes:
  - rscadd: "Some hats now squish down tall hairstyles instead of hiding them, and some hairstyles have parts that stick out over headwear."
  - rscadd: "You can loosen the straps of a sec helmet to show your hair."
  - rscadd: "Added several new hairstyles."
  - rscadd: "Added platforms, steps and wooden stages. You can walk freely between tables, platforms and nearby crates."
  - rscadd: "Added deep water that drains your stamina and can drown you. Ceruleans and other aquatic critters swim through it just fine."
  - rscadd: "The siren pirate shuttle has its stage back."
  - rscadd: "Added the GMM spotlight station trait, which shines a spotlight on the richest crewmate every paycheck."