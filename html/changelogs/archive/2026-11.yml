  - rscadd: Robotics can build IPC shells after unlocking the required research by
      assembling an IPC core, synthetic organs, a wired and secured head, limbs, and
      a wired and secured screen, then finalizing the chassis with a multitool.
  - rscadd: Built IPC shells start without a brain or charging cord. MMIs and positronic
      brains, including brains recovered from roundstart IPCs, can be installed through
      cybernetic brain surgery. Charging cords can be installed separately through
      augmentation surgery.
