    - rscadd: Fish can be sold through cargo, bigger fish sell for more.
    - rscdel: Removed the specific fish bounty, the other two pay a bit more.
    - balance: Without a reel line the rod range is shorter. The master fishing rod
        comes with a better line and hook.
    - balance: Reacting fast when a fish bites gives you a head start in the minigame.
        Clicking early only delays the bite a bit instead of resetting it.
    - balance: Bait quality affects the chance of rarer fish. Any bait removes fishing
        duds.
