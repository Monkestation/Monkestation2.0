author: "CabinetOnFire, Iamgoofball, SmArtKar, Ben10Omintrix, san7890, JohnFulpWillard, LT3, AnturK, Jacquerel, Maia-J, vinylspiders, MrMelbert, Roxy, Iajret, Waterpig, Bloop, FlufflesTheDog, FalloutFalcon"
delete-after: True
changes:
  - refactor: "Replaced our mob AI with behavior trees. Every mob that thinks for itself was moved over, so report anything acting weird"
  - refactor: "Cats, gondolas, hamsters, all bots, polar bears, geese, vatbeasts, dark wizards, leapers, illusions, arena fish, crawling shadows, darkspawn progenitors and blood-drunk miners are basic mobs now"
  - rscadd: "Floorbots were replaced by repairbots, which fix floors, walls and windows"
  - rscadd: "Cats can live in cat houses, and pets converted by the cult draw revive runes for it"
  - admin: "New \"View Behavior Tree\" debug verb to see what a mob is thinking live"
  - balance: "Picking up a small mob now needs an aggressive grab"
  - rscdel: "Removed the curse blob, which never spawned"
  - qol: "Monkeys avoid stepping on glass tables"