author: "V2LenKagamine"
delete-after: True
changes:
  - refactor: "Moves old modular art sci in monkestation/modules to just code/modules."
  - bugfix: "Size Change ++ Artifacts no longer anchor when too large to carry."
  - bugfix: "Fixes an issue where bomb artifacts had a good chance to just not bomb."
  - bugfix: "Fixes a bug where blood artifacts could not generate."
  - bugfix: "Fixed a bug that caused valid origins to make the effect unobtainable."
  - bugfix: "Small artifact effects can no longer roll on larger objects"
  - bugfix: "radiation artifacts no longer always trigger at 1."
  - bugfix: "narsie artifact no longer steals all your blood."
  - bugfix: "attempts to stop some cases where artifacts try to activate on non-existing artifacts."
  - rscadd: "Adds a couple more lines to artifact inspects."
  - rscadd: "Adds some more whisper fault lines."
  - rscadd: "Adds a \"Do Not Roll\" var for artifacts for base-class artifact effects."
  - rscadd: "A few new asteroid shapes for variety"
  - rscadd: "Artifact that turns things into gold."
  - rscadd: "Artifact that grants a wizard spell from a list. Mostly defensive spells."
  - rscadd: "Artifact that makes things fantasy flavored"
  - balance: "Nudges the weights around for item-like artifacts in spawn_artifact."
  - balance: "Asteroids are now considerably more mineral [and artifact] dense"
  - balance: "blood artifacts now only need 3 bodies of blood to generate a reward"
  - balance: "Its A secret [Literally] artifact is now slightly more common"
  - qol: "New Medium chance rock for Asteroids"
  - qol: "A few objects with forced artifact effects [For easier admin spawn or map making]"
  - code_imp: "Re-organised the artifact init to ensure artifacts are given the correct naming and icon if given a forced effect somehow"
  - refactor: "Artifact stimuli are no longer bitflags, but string lists to be compared."
  - refactor: "Rework artifact_activators in base class to dynamically compile from all availible, and is now called \"all_activators\""
  - bugfix: "Artifacts no longer trigger faults from activators they don't have."
  - bugfix: "Artifact fourms no longer show un-achievable effects, and have a 'no fault' option"
  - bugfix: "smol_rock no longer uses the wrong asteroid rock."
  - bugfix: "soap artifacts work again."
  - bugfix: "add SINGULAR missing `.` in artifact wand text."
  - balance: "The average artifact is worth far more to cargo. Weapons[and things that could be used as such] are worth more."
  - balance: "Flawless artifacts now sell for more than flawed artifacts."
  - balance: "powergen artifacts are harder to trigger instant death zapps."
  - code_imp: "try_add_effect on artifact now null-checks its 1 argument"
  - bugfix: "Aritfact wands now properly summon weird type artifacts, like batteries and generators, from disks."
  - balance: "Artifact wands are now considerably more expensive. Go mine them dammit!"
  - balance: "Bomb artifacts are now 5% chance to be a dud. Fuck around find out."
  - balance: "dark altar artifacts made more common"
  - balance: "Artifact wands can now summon a full copy of disks [for things like battery artifacts]"
  - rscadd: "New chaos smoke effect for artifacts. God save you."
  - rscadd: "New Mind swap effect for artifacts. Zipp zoop."